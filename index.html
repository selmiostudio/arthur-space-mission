
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101936">

  <title>Arthur's Space Mission | 5th Birthday</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>

  <main class="hero" id="hero">

    <div class="stars" aria-hidden="true"></div>

    <div class="hero-content">

      <p class="eyebrow">YOU ARE INVITED TO</p>

      <h1>
        ARTHUR'S
        <span>SPACE MISSION</span>
      </h1>

      <p class="subtitle">
        CAPTAIN ARTHUR IS TURNING 5!
      </p>

      <div class="rocket-container">
        <img
          src="assets/images/rocket.png"
          alt="Space rocket"
          class="rocket"
        >
      </div>

      <p class="date">OCTOBER 30, 2026</p>

      <button id="startMission" class="start-button">
        START MISSION
        <span aria-hidden="true">✦</span>
      </button>

      <p class="bottom-text">
        YOUR SPACE ADVENTURE BEGINS HERE
      </p>

    </div>

  </main>
  
<!-- SCREEN 2: MEET CAPTAIN ARTHUR -->
<section class="captain-screen" id="captainScreen"
         aria-labelledby="captainTitle">

  <div class="captain-stars" aria-hidden="true"></div>

  <img
    src="assets/images/saturn.png"
    alt=""
    class="captain-saturn"
  >

  <img
    src="assets/images/moon.png"
    alt=""
    class="captain-moon"
  >

  <div class="captain-content">

    <p class="captain-eyebrow">MISSION 005</p>

    <h2 id="captainTitle">MEET CAPTAIN
      <span>ARTHUR</span>
    </h2>

    <img
      src="assets/images/astronaut.png"
      alt="Captain Arthur the astronaut"
      class="captain-astronaut"
    >

    <h3>ARTHUR IS TURNING 5!</h3>

    <p class="captain-description">
      Our little astronaut is ready for
      his biggest adventure yet!
    </p>

    <button class="captain-button" id="continueJourney">
      CONTINUE THE JOURNEY ✦
    </button>

  </div>
</section>


</body>
</html>
